<div class="card auth-card">
  <div class="card-body">
    <h1 class="auth-title">Signup</h1>
    <form (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" autocomplete="email" required [(ngModel)]="email">
      </div>
      <div class="form-field">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" autocomplete="username" required [(ngModel)]="username">
      </div>
      <div class="form-field">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" class="form-control" id="dob" name="dob" [(ngModel)]="dob">
      </div>
      <div class="form-field">
        <label for="password" class="form-label">Password</label>
        <input [type]="showPassword() ? 'text' : 'password'" class="form-control" id="password" name="password" autocomplete="new-password" required [(ngModel)]="password">
      </div>
      <div class="form-check text-start">
        <input type="checkbox" class="form-check-input" id="show-password" aria-controls="password" (change)="togglePasswordVisibility()">
        <label class="form-check-label" for="show-password">Show password</label>
      </div>
      @if (errorMessage()) {
        <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
      }
      <div class="button-row">
        <button type="button" class="btn btn-outline-dark" routerLink="/">Login</button>
        <button type="submit" class="btn btn-outline-dark">Submit</button>
      </div>
    </form>
  </div>
</div>
