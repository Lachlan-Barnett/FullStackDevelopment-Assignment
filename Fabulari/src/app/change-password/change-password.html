<div class="card auth-card">
  <div class="card-body">
    <h1 class="auth-title">Change Password</h1>
    <form (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="currentPassword" class="form-label">Current Password</label>
        <input
          [type]="showCurrentPassword() ? 'text' : 'password'"
          class="form-control"
          id="currentPassword"
          name="currentPassword"
          autocomplete="current-password"
          [(ngModel)]="currentPassword"
        />
      </div>
      <div class="form-check text-start">
        <input
          type="checkbox"
          class="form-check-input"
          id="show-current-password"
          aria-controls="currentPassword"
          (change)="toggleCurrentPassword()"
        />
        <label class="form-check-label" for="show-current-password">Show current password</label>
      </div>
      <div class="form-field">
        <label for="newPassword" class="form-label">New Password</label>
        <input
          [type]="showNewPassword() ? 'text' : 'password'"
          class="form-control"
          id="newPassword"
          name="newPassword"
          autocomplete="new-password"
          maxlength="100"
          [(ngModel)]="newPassword"
        />
      </div>
      <div class="form-check text-start">
        <input
          type="checkbox"
          class="form-check-input"
          id="show-new-password"
          aria-controls="newPassword"
          (change)="toggleNewPassword()"
        />
        <label class="form-check-label" for="show-new-password">Show new password</label>
      </div>
      <div class="form-field">
        <label for="confirmPassword" class="form-label">Re-Type Password</label>
        <input
          [type]="showConfirmPassword() ? 'text' : 'password'"
          class="form-control"
          id="confirmPassword"
          name="confirmPassword"
          autocomplete="new-password"
          maxlength="100"
          [(ngModel)]="confirmPassword"
        />
      </div>
      <div class="form-check text-start">
        <input
          type="checkbox"
          class="form-check-input"
          id="show-confirm-password"
          aria-controls="confirmPassword"
          (change)="toggleConfirmPassword()"
        />
        <label class="form-check-label" for="show-confirm-password">Show re-typed password</label>
      </div>
      @if (errorMessage()) {
        <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
      }
      <div class="button-row">
        <button type="submit" class="btn btn-outline-dark">Submit</button>
        <button type="button" class="btn btn-outline-dark" routerLink="/settings">&lt; Back</button>
      </div>
    </form>
  </div>
</div>
